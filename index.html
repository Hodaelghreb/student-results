<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results Management</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-4">
            نظام إدارة نتائج الطلاب
        </h1>

        <!-- Student Input Form -->
        <div class="card p-4 mb-4">

            <h3 class="mb-3">إضافة طالب جديد</h3>

            <div class="mb-3">
                <label for="studentName" class="form-label">
                    اسم الطالب
                </label>

                <input type="text"
                       id="studentName"
                       class="form-control"
                       placeholder="أدخل اسم الطالب">
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="grade1" class="form-label">
                        درجة المادة الأولى
                    </label>

                    <input type="number"
                           id="grade1"
                           class="form-control"
                           placeholder="أدخل الدرجة">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="grade2" class="form-label">
                        درجة المادة الثانية
                    </label>

                    <input type="number"
                           id="grade2"
                           class="form-control"
                           placeholder="أدخل الدرجة">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="grade3" class="form-label">
                        درجة المادة الثالثة
                    </label>

                    <input type="number"
                           id="grade3"
                           class="form-control"
                           placeholder="أدخل الدرجة">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="attendance" class="form-label">
                        نسبة الحضور
                    </label>

                    <input type="number"
                           id="attendance"
                           class="form-control"
                           placeholder="أدخل نسبة الحضور">
                </div>

            </div>

            <!-- Error Messages -->
            <div id="errorMessage"
                 class="alert alert-danger d-none"
                 role="alert">
            </div>

            <!-- Add Student Button -->
            <button id="addStudentBtn"
                    type="button"
                    class="btn btn-primary w-100 mb-3">
                إضافة طالب
            </button>

            <!-- Mercy Committee Button -->
            <button id="mercyCommitteeBtn"
                    type="button"
                    class="btn btn-success w-100">
                تفعيل لجنة الرأفة
            </button>

        </div>

        <!-- Students List -->
        <div class="card p-4 mb-4">

            <h3 class="mb-3">قائمة الطلاب</h3>

            <div id="studentsList">
            </div>

        </div>

        <!-- Mercy Committee Report -->
        <div class="card p-4 mb-4">

            <h3 class="mb-3">
                التقرير النهائي للجنة الرأفة
            </h3>

            <div id="mercyReport">
            </div>

        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>

</body>
</html>
